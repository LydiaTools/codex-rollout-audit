[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-rollout-audit"
version = "0.1.0"
description = "Read-only disk-usage audit for Codex rollout families"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "LydiaTools"}]
keywords = ["codex", "disk-usage", "rollout", "subagent", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Filesystems",
]
dependencies = []

[project.urls]
Source = "https://github.com/LydiaTools/codex-rollout-audit"
Issues = "https://github.com/LydiaTools/codex-rollout-audit/issues"

[project.scripts]
codex-rollout-audit = "codex_rollout_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
